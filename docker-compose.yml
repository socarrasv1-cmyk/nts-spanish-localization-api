version: '3.8'

services:
  nts-localization-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nts-localization-api
    ports:
      - "8000:8000"
    environment:
      NTS_API_KEY: ${NTS_API_KEY:-your-secret-key}
      NTS_DATA_DIR: /app/data
      NTS_GIT_REPO_PATH: /app/data/git-repo
      NTS_GIT_REMOTE_NAME: origin
      NTS_GIT_DEFAULT_BASE_BRANCH: main
      NTS_GIT_PUSH_ENABLED: "false"
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
      - ./app:/app/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - nts-network

networks:
  nts-network:
    driver: bridge
